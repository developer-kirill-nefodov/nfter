user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # "Connection: upgrade" only when the client actually asked to upgrade;
    # every other request keeps a normal keep-alive connection.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 3000;
        listen [::]:3000;
        server_name _;

        # Docker's embedded DNS. Without a resolver, nginx looks the upstreams up
        # exactly once — at startup — and a container that is recreated comes back
        # on a new IP that nginx never learns about, answering 502 forever. Putting
        # the address in a variable is what forces the lookup to happen per request.
        resolver 127.0.0.11 valid=10s ipv6=off;

        set $site_upstream site:3000;
        set $api_upstream api:3001;

        location / {
            proxy_pass http://$site_upstream;
            proxy_http_version 1.1;

            # Vite's HMR socket connects to "/" itself, not to a /ws path — so
            # the upgrade headers have to be here, or the dev server can never
            # push a reload and the browser sits on a stale module graph.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # An upgraded connection is idle by nature — it waits for the server to
            # say something. With the default 60s read timeout nginx hangs up on a
            # quiet socket, and the client sees a drop it never caused.
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api {
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;

            # The live feed lives at /api/live and needs the same upgrade path.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
