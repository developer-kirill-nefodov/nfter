services:
  site:
    build:
      context: ../
      dockerfile: ./docker/local/site.Dockerfile
    env_file: ../app/frontend/.env
    volumes:
      - ../app/frontend:/app
      # An anonymous volume keeps the image's node_modules from being shadowed
      # by the bind mount above — otherwise the container starts with whatever
      # (or nothing) the host happens to have installed.
      - /app/node_modules
    restart: unless-stopped
    networks: [nfter]

  api:
    build:
      context: ../
      dockerfile: ./docker/local/api.Dockerfile
    # The .env is mounted, not baked into the image: a secret copied in at build
    # time lives in an image layer forever.
    env_file: ../app/backend/.env
    volumes:
      - ../app/backend:/home/nodejs/api
      - /home/nodejs/api/node_modules
    restart: unless-stopped
    networks: [nfter]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # The volume has to be mounted where Postgres actually keeps its data.
      # The old compose pointed PGDATA at ./postgres and mounted /data/postgres,
      # so nothing was ever persisted.
      - nfter-data:/var/lib/postgresql/data
    networks: [nfter]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1 --loglevel warning
    volumes:
      - nfter-redis:/data
    networks: [nfter]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every password-reset email locally instead of sending it.
  # Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '8025:8025'
    networks: [nfter]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '3000:3000'
    networks: [nfter]
    depends_on:
      api:
        condition: service_healthy

volumes:
  nfter-data:
  nfter-redis:

networks:
  nfter:
    external: false
